services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:///./data/processed/shonartalent.db
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "python -m scripts.seed_data && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
