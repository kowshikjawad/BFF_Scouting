[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shonartalent-ai"
version = "0.1.0"
description = "Bangladeshi Football Scouting & Talent Discovery Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ShonarTalent AI" }]

dependencies = [
    # Data ingestion
    "soccerdata>=1.6",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.0",
    # ML / analytics
    "scikit-learn>=1.3",
    "numpy>=1.24",
    # Backend API
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
    # Data storage
    "sqlalchemy>=2.0",
    # Visualisation (frontend)
    "plotly>=5.18",
    "streamlit>=1.32",
    "python-dotenv>=1.0",
    # PDF export
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pypdf>=5.0",
    "httpx>=0.26",
    "ruff>=0.1",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "scrapers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]